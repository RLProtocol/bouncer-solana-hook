[package]
name = "bouncer-hook"
version = "0.1.0"
description = "Bouncer anti-bundle transfer hook for Meteora DBC launches"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bouncer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
short-ticker-lock = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["interface-instructions", "init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token_2022", "token_2022_extensions"] }
spl-tlv-account-resolution = "0.9.0"
spl-transfer-hook-interface = "0.9.0"
